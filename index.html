<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المشروع الإسلامي الشامل</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        /* --- المتغيرات العامة --- */
        :root {
            --main-color: #fff;
            --sabha-color: rgb(48, 73, 92);
            --accent-color: #bfa668;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(130, 130, 130, 0.371);
            --select-bg: #1a2630;
            --font-quran: 'Amiri', serif;
            --font-ui: 'Cairo', sans-serif;
            
            /* الوضع الليلي الافتراضي */
            --bg-body: linear-gradient(346deg, var(--sabha-color), #000000);
            --shadow-color: rgba(0,0,0,0.5);
            --border-qibla: var(--main-color) var(--main-color) var(--sabha-color) var(--sabha-color);
            --needle-color: linear-gradient(to top, var(--main-color), var(--sabha-color));
            --needle-active: linear-gradient(to top, #4ade80, #166534); /* لون أخضر عند التطابق */
        }

        /* --- التنسيق الأساسي --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-ui);
            color: var(--main-color);
        }

        body {
            background: var(--bg-body);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.8s ease;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            z-index: 100;
        }

        #mood {
            font-size: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        #logo {
            width: 60px;
            animation: rotat 15s linear infinite;
        }

        @keyframes rotat {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateY(360deg) rotateX(360deg); }
        }

        /* --- التنقل السفلي --- */
        .groupButton {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: space-evenly;
            width: 90%;
            max-width: 400px;
            background: linear-gradient(346deg, var(--sabha-color), #00000051);
            border: #253745 2px solid;
            padding: 5px;
            border-radius: 30px;
            z-index: 1000;
            box-shadow: 0 10px 30px var(--shadow-color);
        }

        .groupButton b {
            font-size: 30px;
            cursor: pointer;
            padding: 10px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: aliceblue;
        }

        .groupButton b:hover, .groupButton b.active {
            transform: scale(1.1) skewY(10deg);
            background-color: rgba(255,255,255,0.1);
        }

        /* --- الحاويات --- */
        .page-section {
            display: none;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px;
            padding-bottom: 100px;
            animation: op 0.5s ease;
        }

        .page-section.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes op {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* --- المواقيت --- */
        .contime { width: 100%; }

        .tare {
            width: 350px;
            max-width: 95%;
            background: var(--glass-bg);
            border-radius: 20px;
            padding: 10px;
            margin: 0 auto 20px auto;
            box-shadow: -3px 10px 13px 2px var(--shadow-color);
            text-align: center;
            perspective: 600px;
            transition: 1s linear;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .tare:hover {
             transform: translateY(-5px);
        }

        .cf, .cb {
            display: flex;
            justify-content: space-between;
            padding: 5px;
            font-size: 16px;
        }

        ul#ul {
            width: 100%;
            list-style: none;
            padding: 0 10px;
        }

        ul#ul li {
            background: var(--glass-bg);
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 15px; 
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            transition: 0.9s;
            box-shadow: 0px 5px 10px var(--shadow-color);
        }

        ul#ul li:hover {
            transform: scale(1.02);
        }

        input[type="date"] {
            margin-top: 15px;
            padding: 10px;
            border-radius: 20px;
            border: none;
            background: var(--input-bg);
            color: var(--main-color);
            width: 80%;
            text-align: center;
            cursor: pointer;
            outline: none;
        }

        /* --- القرآن --- */
        .cq { direction: rtl; }

        #select { width: 100%; margin-bottom: 20px; }

        #select select {
            width: 100%;
            padding: 10px;
            background: var(--select-bg);
            color: white;
            border-radius: 20px;
            font-size: 20px;
            font-family: 'Amiri', serif;
            border: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: center;
            outline: none;
        }

        #sr {
            width: 100%;
            background-color: var(--glass-bg);
            backdrop-filter: blur(5px);
            padding: 15px;
            border-radius: 15px;
            min-height: 300px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        .ayaha {
            font-family: var(--font-quran);
            font-size: 24px;
            line-height: 2.2;
            text-align: justify;
            text-align-last: center;
            color: var(--main-color);
        }

        .verse-symbol {
            color: var(--accent-color);
            font-size: 0.8em;
            margin: 0 5px;
        }

        /* --- السبحة (التصميم القديم بدقة) --- */
        #sabha {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 170px;
            height: 200px;
            border-radius: 77px 76px 106px 106px; /* الشكل القديم */
            background: linear-gradient(299deg, rgb(0, 0, 0), var(--sabha-color));
            margin: 80px auto auto auto;
            gap: 2px;
            border: 2px double rgb(19, 12, 12);
            box-shadow: 4px 5px 7px 1px var(--sabha-color);
            transform: scale(1.2);
        }

        #disnumber {
            border: 2px solid rgba(255, 255, 255, 0.371);
            width: 80%;
            color: white;
            text-align: center;
            background-color: #00000061;
            border-radius: 10px;
            transform: translateY(-10px);
            height: 30px;
            box-shadow: 3px 7px 3px 5px #09080873;
            font-size: 20px;
            font-family: monospace;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .st {
            display: flex;
            flex-direction: column;
            gap: 6px;
            transform: rotate(26deg); /* التدوير القديم */
        }

        .st > div {
            display: flex;
            justify-content: space-evenly;
            gap: 9px;
        }

        #plus {
            padding: 5px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #cacaca;
            transform: translate(10px);
            border: none;
            cursor: pointer;
            box-shadow: 3px 7px 3px 5px #09080880;
        }
        #plus:active { background-color: #aaa; }

        #remove {
            padding: 5px;
            width: 18px;
            box-shadow: #000000 2px 2px 2px;
            height: 18px;
            margin-bottom: 20px;
            border-radius: 50%;
            background-color: rgb(90, 9, 9);
            transform: translateY(14px);
            border: none;
            cursor: pointer;
        }

        #color {
            padding: 5px;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: linear-gradient(299deg, green, gold, pink, #d54a4a, rgb(8, 25, 85), rgb(204 160 203), white);
            transform: translate(-4px, 6px);
            border: none;
            cursor: pointer;
        }

        /* --- القبلة (محسن) --- */
        #conqubla { text-align: center; }
        
        #conqubla .div {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border-style: dotted;
            border-color: var(--border-qibla);
            border-width: 7px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset -1px 6px 20px 20px #ffffff26, -1px 1px 17px 1px var(--sabha-color);
            background: none;
            position: relative;
        }
        
        /* مؤشر القبلة: سهم مفصل */
        #rotatex {
            background: var(--needle-color);
            height: 240px;
            width: 16px;
            /* شكل إبرة البوصلة */
            clip-path: polygon(50% 0%, 80% 15%, 50% 100%, 20% 15%);
            border-radius: 0; 
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* حركة ناعمة */
            position: static; 
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* حالة التطابق (لون أخضر) */
        #rotatex.aligned {
            background: var(--needle-active);
            box-shadow: 0 0 15px #4ade80;
        }
        
        #show {
            margin-top: 20px;
            font-family: monospace;
            direction: ltr;
        }

        #startCompass {
            background: var(--sabha-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: none; 
        }

        /* أيقونة الكعبة في المنتصف */
        .kaaba-center {
            position: absolute;
            font-size: 30px;
            color: var(--main-color);
            opacity: 0.8;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div class="header-bar">
        <div id="mood"><i class="fa fa-moon-o"></i></div>
        <img src="lo1.png" id="logo" alt="Logo"> 
    </div>

    <!-- 1. المواقيت -->
    <div class="page-section contime active" id="page-time">
        <div class="tare">
            <div id="hijri-date" class="cf">جاري التحميل...</div>
            <div id="gregorian-date" class="cb"></div>
        </div>
        <ul id="ul">
            <li style="text-align:center;">جاري جلب المواقيت...</li>
        </ul>
        <input type="date" id="dateInput" onchange="getPrayerTimesByDate(this.value)">
    </div>

    <!-- 2. القرآن -->
    <div class="page-section cq" id="page-quran">
        <div style="text-align: center; margin-bottom: 10px; color: var(--accent-color);">
            <i class="fas fa-quran fa-3x"></i>
            <h2 style="margin-top: 10px;">القرآن الكريم</h2>
        </div>
        <div id="select"></div>
        <div id="sr">
            <p style="text-align: center; padding-top: 50px;">اختر سورة للبدء بالقراءة</p>
        </div>
    </div>

    <!-- 3. القبلة -->
    <div class="page-section" id="page-qibla">
        <div id="conqubla">
            <h2>اتجاه القبلة</h2>
            <p>انحراف القبلة عن الشمال: <span id="span">0</span>°</p>
            <br>
            <button id="startCompass" onclick="requestCompassPermission()">تفعيل البوصلة</button>
            <div class="div">
                <i class="fas fa-kaaba kaaba-center"></i>
                <div id="rotatex"></div> <!-- السهم -->
            </div>
            <div id="show">يرجى تحريك الهاتف على شكل رقم 8 للمعايرة</div>
        </div>
    </div>

    <!-- 4. السبحة -->
    <div class="page-section" id="page-sabha">
        <div id="sabha">
            <p id="disnumber">0</p>
            <div class="st">
                <div>
                    <button id="remove"></button>
                    <button id="color"></button>
                </div>
                <button id="plus"></button>
            </div>
        </div>
    </div>

    <!-- القائمة -->
    <div class="groupButton">
        <b id="b1" onclick="showPage('page-sabha', this)"><i class="fas fa-fingerprint"></i></b>
        <b id="b3" onclick="showPage('page-quran', this)"><i class="fas fa-book-open"></i></b>
        <b id="b4" onclick="showPage('page-qibla', this)"><i class="far fa-compass"></i></b>
        <b id="b5" onclick="showPage('page-time', this)" class="active"><i class="fas fa-clock"></i></b>
    </div>

    <script>
        // --- إدارة التنقل ---
        function showPage(pageId, btnElement) {
            document.querySelectorAll('.page-section').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');

            document.querySelectorAll('.groupButton b').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            if (pageId === 'page-qibla') initQibla();
            if (pageId === 'page-quran' && document.querySelector('#select select') === null) getQuran();
        }

        // --- 1. المواقيت ---
        const ul = document.getElementById("ul");
        const hijriDiv = document.getElementById("hijri-date");
        const gregDiv = document.getElementById("gregorian-date");

        function initPrayerTimes() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => fetchTimes(pos.coords.latitude, pos.coords.longitude),
                    err => fetchTimes(30.0444, 31.2357) // Default Cairo
                );
            } else {
                fetchTimes(30.0444, 31.2357);
            }
        }

        async function fetchTimes(lat, long) {
            try {
                let res = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${long}`);
                let data = await res.json();
                let t = data.data.timings;
                let d = data.data.date;

                hijriDiv.innerHTML = `<p>التاريخ الهجري:</p><p>${d.hijri.date}</p>`;
                gregDiv.innerHTML = `<p>التاريخ الميلادي:</p><p>${d.gregorian.date}</p>`;

                const prayers = [
                    { n: 'الفجر', t: t.Fajr }, { n: 'الشروق', t: t.Sunrise },
                    { n: 'الظهر', t: t.Dhuhr }, { n: 'العصر', t: t.Asr },
                    { n: 'المغرب', t: t.Maghrib }, { n: 'العشاء', t: t.Isha }
                ];

                ul.innerHTML = prayers.map(p => `
                    <li><p>${convertTo12Hour(p.t)}</p><p>${p.n}</p></li>
                `).join('');
            } catch (e) { ul.innerHTML = "<p>فشل الاتصال</p>"; }
        }

        function convertTo12Hour(time) {
            let [h, m] = time.split(':');
            let ampm = h >= 12 ? 'م' : 'ص';
            h = h % 12 || 12; 
            return `${h}:${m} ${ampm}`;
        }
        function getPrayerTimesByDate(val){ console.log(val); }

        // --- 2. القرآن ---
        const selectContainer = document.getElementById("select");
        const sr = document.getElementById("sr");

        async function getQuran() {
            try {
                selectContainer.innerHTML = "<p style='text-align:center'>جاري التحميل...</p>";
                let res = await fetch("https://api.alquran.cloud/v1/surah");
                let data = await res.json();
                let options = data.data.map(s => `<option value="${s.number}">${s.number} - ${s.name}</option>`).join('');
                selectContainer.innerHTML = `<select onchange="getAyas(this.value)"><option value="" disabled selected>-- اختر السورة --</option>${options}</select>`;
            } catch (e) { selectContainer.innerHTML = "فشل التحميل"; }
        }

        async function getAyas(num) {
            sr.innerHTML = "<p style='text-align:center;'>جاري جلب الآيات...</p>";
            try {
                let res = await fetch(`https://api.alquran.cloud/v1/surah/${num}`);
                let data = await res.json();
                let ayahs = data.data.ayahs;
                let fullText = "";
                if(num != 1 && num != 9) fullText += `<div style="text-align:center; margin-bottom:15px; color:var(--accent-color);">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>`;
                
                fullText += ayahs.map(a => {
                    let txt = (num != 1 && a.numberInSurah === 1) ? a.text.replace("بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ", "") : a.text;
                    return `${txt} <span class="verse-symbol">(${a.numberInSurah})</span> `;
                }).join('');
                sr.innerHTML = `<div class="ayaha">${fullText}</div>`;
            } catch (e) { sr.innerHTML = "<p>خطأ</p>"; }
        }

        // --- 3. القبلة (منطق محسن مع الاهتزاز) ---
        const rotatex = document.getElementById("rotatex");
        const span = document.getElementById("span");
        const startCompassBtn = document.getElementById("startCompass");
        let qiblaDir = 0;
        let currentRotation = 0; // للحركة الناعمة

        function initQibla() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async function (pos) {
                    let lat = pos.coords.latitude;
                    let long = pos.coords.longitude;
                    let res = await fetch(`https://api.aladhan.com/v1/qibla/${lat}/${long}`);
                    let data = await res.json();
                    qiblaDir = data.data.direction;
                    
                    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                        startCompassBtn.style.display = 'inline-block';
                    } else {
                        window.addEventListener("deviceorientation", handleOrientation, true);
                    }
                    
                    // وضع مبدئي
                    updateCompassUI(0);
                });
            }
        }

        function requestCompassPermission() {
            DeviceOrientationEvent.requestPermission()
            .then(response => {
                if (response == 'granted') {
                    window.addEventListener('deviceorientation', handleOrientation, true);
                    startCompassBtn.style.display = 'none';
                }
            })
            .catch(console.error);
        }

        function handleOrientation(event) {
            let compass;
            if(event.webkitCompassHeading) {
                // iOS
                compass = event.webkitCompassHeading;
            } else {
                // Android وغيره
                compass = 360 - event.alpha;
            }
            
            // حساب الزاوية المطلوبة (اتجاه القبلة - اتجاه الجهاز)
            let targetAngle = qiblaDir - compass;
            
            // --- منطق الحركة الناعمة (Wrap-around Logic) ---
            // هذا يمنع السهم من الدوران لفة كاملة عند الانتقال من 359 إلى 0
            let diff = targetAngle - currentRotation;
            while (diff < -180) diff += 360;
            while (diff > 180) diff -= 360;
            currentRotation += diff;
            
            updateCompassUI(currentRotation, Math.abs(diff) < 2); // تمرير دقة المحاذاة
        }

        function updateCompassUI(angle, isSteady) {
            rotatex.style.transform = `rotate(${angle}deg)`;
            span.innerHTML = Math.round(qiblaDir);

            // التحقق من المحاذاة لتشغيل الاهتزاز وتغيير اللون
            // نتحقق من باقي القسمة على 360 لأن الزاوية قد تكون تراكمية (مثلا 720)
            let normalizedAngle = ((angle % 360) + 360) % 360;
            
            // إذا كان السهم يشير للأعلى (0 درجة) بتسامح +/- 5 درجات
            // يعني القبلة أمام الجهاز مباشرة
            if (normalizedAngle < 5 || normalizedAngle > 355) {
                rotatex.classList.add('aligned');
                if (navigator.vibrate && isSteady) {
                    // اهتزاز خفيف لتنبيه المستخدم (مرة واحدة كل فترة لتجنب الازعاج يمكن ضبطه)
                    // هنا سيهتز بشكل مستمر خفيف طالما هو مصوب
                   // navigator.vibrate(10); 
                }
            } else {
                rotatex.classList.remove('aligned');
            }
        }

        // --- 4. السبحة ---
        const disnumber = document.getElementById("disnumber");
        const sabhaCon = document.getElementById("sabha");
        
        if (localStorage.sabhaCount) disnumber.innerHTML = localStorage.sabhaCount;
        if (localStorage.sabhaColor) document.documentElement.style.setProperty("--sabha-color", localStorage.sabhaColor);

        document.getElementById("plus").onclick = () => {
            disnumber.innerHTML = parseInt(disnumber.innerHTML) + 1;
            localStorage.setItem("sabhaCount", disnumber.innerHTML);
            if(navigator.vibrate) navigator.vibrate(30);
        };
        
        document.getElementById("remove").onclick = () => {
            disnumber.innerHTML = 0;
            localStorage.setItem("sabhaCount", 0);
        };

        const colors = ["#253745", "#369a78", "#bc8f21", "#7e357e"];
        let cIdx = 0;
        document.getElementById("color").onclick = () => {
            cIdx = (cIdx + 1) % colors.length;
            let nc = colors[cIdx];
            document.documentElement.style.setProperty("--sabha-color", nc);
            localStorage.setItem("sabhaColor", nc);
            sabhaCon.style.border = (cIdx % 2 == 0) ? "2px double white" : "2px double green";
        };

        // --- الوضع الليلي/النهاري ---
        const moodBtn = document.getElementById("mood");
        let isDark = true;
        
        moodBtn.onclick = () => {
            isDark = !isDark;
            if(!isDark) {
                // الوضع النهاري (أبيض ثلجي فاخر)
                document.documentElement.style.setProperty("--bg-body", "linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%)");
                document.documentElement.style.setProperty("--main-color", "#2c3e50");
                document.documentElement.style.setProperty("--glass-bg", "rgba(255, 255, 255, 0.85)");
                document.documentElement.style.setProperty("--shadow-color", "rgba(163, 177, 198, 0.6)");
                document.documentElement.style.setProperty("--input-bg", "#dfe6e9");
                document.documentElement.style.setProperty("--select-bg", "#34495e");
                document.documentElement.style.setProperty("--border-qibla", "#2c3e50 #2c3e50 var(--sabha-color) var(--sabha-color)");
                
                moodBtn.innerHTML = '<i class="fa fa-sun-o" style="color:#f39c12"></i>';
                document.getElementById("logo").style.filter = "invert(0)";
            } else {
                // الوضع الليلي
                document.documentElement.style.setProperty("--bg-body", "linear-gradient(346deg, var(--sabha-color), #000000)");
                document.documentElement.style.setProperty("--main-color", "#fff");
                document.documentElement.style.setProperty("--glass-bg", "rgba(255, 255, 255, 0.08)");
                document.documentElement.style.setProperty("--shadow-color", "rgba(0,0,0,0.5)");
                document.documentElement.style.setProperty("--input-bg", "rgba(130, 130, 130, 0.371)");
                document.documentElement.style.setProperty("--select-bg", "#1a2630");
                document.documentElement.style.setProperty("--border-qibla", "#fff #fff var(--sabha-color) var(--sabha-color)");

                moodBtn.innerHTML = '<i class="fa fa-moon-o"></i>';
                document.getElementById("logo").style.filter = "none";
            }
        };

        initPrayerTimes();
    </script>
</body>
</html>
