<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>مواقيت الصلاة الدقيقة — المشروع الإسلامي الشامل</title>

    <meta name="description" content="مواقيت الصلاة الدقيقة والعد التنازلي للأذان القادم مع التاريخ الهجري والميلادي وتحديد الموقع التلقائي.">
    <meta name="keywords" content="مواقيت الصلاة, الفجر, الظهر, العصر, المغرب, العشاء, التاريخ الهجري, أوقات الصلاة">
    <meta name="theme-color" content="#0a1118">
    
    <!-- Open Graph -->
    <meta property="og:title" content="مواقيت الصلاة — المشروع الإسلامي الشامل">
    <meta property="og:description" content="مواقيت الصلاة والعد التنازلي للصلاة القادمة مع التاريخ الهجري والميلادي.">
    <meta property="og:type" content="website">

    <!-- PWA & Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e5b869' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z'/></svg>">
    <link rel="manifest" href="manifest.json">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

    <!-- Header Bar -->
    <header class="header-bar">
        <a href="index.html" class="header-brand" style="text-decoration: none; color: inherit;">
            <div class="brand-text">
                <h1>المشروع الإسلامي</h1>
                <span>القرآن • المواقيت • القبلة • الأذكار</span>
            </div>
        </a>
        <div class="header-actions">
            <button id="theme-toggle-btn" class="header-btn" title="تبديل الوضع الليلي / النهاري">
                <span id="theme-icon-slot">
                    <svg class="koboyo-icon" viewBox="0 0 24 24">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"></path>
                    </svg>
                </span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="app-main">

        <!-- ==============================================
             قسم مواقيت الصلاة (Prayer Times)
             ============================================== -->
        <section class="page-section active" id="page-time">
            <!-- Hero Date & Next Prayer Banner -->
            <div class="prayer-hero-card">
                <div class="location-badge">
                    <svg class="koboyo-icon icon-sm" viewBox="0 0 24 24">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    <span id="user-location-text">جاري تحديد الموقع...</span>
                </div>

                <div class="date-display-row">
                    <div class="date-item">
                        <h3>التاريخ الهجري</h3>
                        <p id="hijri-date-val">--</p>
                    </div>
                    <div class="date-item">
                        <h3>التاريخ الميلادي</h3>
                        <p id="gregorian-date-val">--</p>
                    </div>
                </div>

                <div class="next-prayer-banner">
                    <div class="next-prayer-info">
                        <span class="next-prayer-label">الصلاة القادمة:</span>
                        <div class="next-prayer-name" id="next-prayer-name">--</div>
                    </div>
                    <div>
                        <div class="countdown-box" id="next-prayer-timer">00:00:00</div>
                    </div>
                </div>
            </div>

            <!-- Date Picker Card -->
            <div class="date-picker-card">
                <div class="date-picker-label">
                    <svg class="koboyo-icon" viewBox="0 0 24 24" style="color: var(--accent-gold);">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span>عرض مواقيت ليوم آخر:</span>
                </div>
                <input type="date" id="prayer-date-picker" class="date-input">
            </div>

            <!-- Prayer Times List (Skeleton Loading Initial State) -->
            <div class="prayer-times-grid" id="prayer-times-list">
                <div class="skeleton-row-item">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span class="skeleton-shimmer skeleton-circle" style="width: 26px; height: 26px;"></span>
                        <span class="skeleton-shimmer skeleton-pill" style="width: 90px; height: 16px;"></span>
                    </div>
                    <span class="skeleton-shimmer skeleton-pill" style="width: 65px; height: 18px;"></span>
                </div>
                <div class="skeleton-row-item">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span class="skeleton-shimmer skeleton-circle" style="width: 26px; height: 26px;"></span>
                        <span class="skeleton-shimmer skeleton-pill" style="width: 80px; height: 16px;"></span>
                    </div>
                    <span class="skeleton-shimmer skeleton-pill" style="width: 65px; height: 18px;"></span>
                </div>
                <div class="skeleton-row-item">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span class="skeleton-shimmer skeleton-circle" style="width: 26px; height: 26px;"></span>
                        <span class="skeleton-shimmer skeleton-pill" style="width: 95px; height: 16px;"></span>
                    </div>
                    <span class="skeleton-shimmer skeleton-pill" style="width: 65px; height: 18px;"></span>
                </div>
                <div class="skeleton-row-item">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span class="skeleton-shimmer skeleton-circle" style="width: 26px; height: 26px;"></span>
                        <span class="skeleton-shimmer skeleton-pill" style="width: 90px; height: 16px;"></span>
                    </div>
                    <span class="skeleton-shimmer skeleton-pill" style="width: 65px; height: 18px;"></span>
                </div>
                <div class="skeleton-row-item">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span class="skeleton-shimmer skeleton-circle" style="width: 26px; height: 26px;"></span>
                        <span class="skeleton-shimmer skeleton-pill" style="width: 95px; height: 16px;"></span>
                    </div>
                    <span class="skeleton-shimmer skeleton-pill" style="width: 65px; height: 18px;"></span>
                </div>
                <div class="skeleton-row-item">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span class="skeleton-shimmer skeleton-circle" style="width: 26px; height: 26px;"></span>
                        <span class="skeleton-shimmer skeleton-pill" style="width: 90px; height: 16px;"></span>
                    </div>
                    <span class="skeleton-shimmer skeleton-pill" style="width: 65px; height: 18px;"></span>
                </div>
            </div>
        </section>

    </main>

    <!-- ==============================================
         Bottom Navigation Bar (5 Tabs with Koboyo Icons)
         ============================================== -->
    <nav class="bottom-nav-container">
        <!-- 1. Adhkar -->
        <a href="adhkar.html" class="nav-tab-btn" title="الأذكار">
            <svg class="koboyo-icon" viewBox="0 0 24 24">
                <path d="M12 10a6 6 0 0 0 -6 -6h-3v2a6 6 0 0 0 6 6h3"></path>
                <path d="M12 14a6 6 0 0 1 6 -6h3v1a6 6 0 0 1 -6 6h-3"></path>
                <path d="M12 20v-10"></path>
            </svg>
            <span>الأذكار</span>
        </a>

        <!-- 2. Prayer Times (Active on this page) -->
        <a href="index.html" class="nav-tab-btn active" title="المواقيت">
            <svg class="koboyo-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <polyline points="12 7 12 12 15 15"></polyline>
            </svg>
            <span>المواقيت</span>
        </a>

        <!-- 3. Quran -->
        <a href="quran.html" class="nav-tab-btn" title="القرآن">
            <svg class="koboyo-icon" viewBox="0 0 24 24">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
            <span>القرآن</span>
        </a>

        <!-- 4. Qibla -->
        <a href="qibla.html" class="nav-tab-btn" title="القبلة">
            <svg class="koboyo-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>
            <span>القبلة</span>
        </a>

        <!-- 5. Sabha -->
        <a href="masbaha.html" class="nav-tab-btn" title="السبحة">
            <svg class="koboyo-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="6" r="2"></circle>
                <circle cx="17" cy="8" r="2"></circle>
                <circle cx="19" cy="13" r="2"></circle>
                <circle cx="17" cy="18" r="2"></circle>
                <circle cx="12" cy="20" r="2"></circle>
                <path d="M12 11c0 3.866-2.239 7-5 7s-5-3.134-5-7 2.239-7 5-7 5 3.134 5 7z"></path>
            </svg>
            <span>السبحة</span>
        </a>
    </nav>

    <!-- App Logic Engine -->
    <script src="app.js?v=4"></script>
</body>
