<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>السبحة الإلكترونية الذكية — تسابيح وعداد استغفار — المشروع الإسلامي الشامل</title>
    
    <!-- SEO & Metadata -->
    <meta name="description" content="سبحة إلكترونية رقمية ذكية مع مؤشر دائري تقدمي، اهتزاز تفاعلي، تغيير ألوان الخرز، وأهداف التسبيح ۳۳، ۹۹، ۱۰۰، وحر.">
    <meta name="keywords" content="سبحة إلكترونية, تسبيح, عداد الاستغفار, مسبحة رقمية, أذكار التسبيح">
    <meta name="theme-color" content="#0a1118">
    
    <!-- Open Graph -->
    <meta property="og:title" content="السبحة الإلكترونية الذكية — المشروع الإسلامي الشامل">
    <meta property="og:description" content="سبحة إلكترونية فاخرة متطورة للتسبيح والاستغفار.">
    <meta property="og:type" content="website">

    <!-- PWA & Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e5b869' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z'/></svg>">
    <link rel="manifest" href="manifest.json">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

    <!-- Header Bar -->
    <header class="header-bar">
        <a href="index.html" class="header-brand" style="text-decoration: none; color: inherit;">
            <div class="brand-text">
                <h1>المشروع الإسلامي</h1>
                <span>القرآن • المواقيت • القبلة • الأذكار</span>
            </div>
        </a>
        <div class="header-actions">
            <button id="theme-toggle-btn" class="header-btn" title="تبديل الوضع الليلي / النهاري">
                <span id="theme-icon-slot">
                    <svg class="koboyo-icon" viewBox="0 0 24 24">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"></path>
                    </svg>
                </span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="app-main">

        <!-- ==============================================
             قسم السبحة الإلكترونية (Digital Masbaha)
             ============================================== -->
        <section class="page-section active" id="page-sabha">
            <div class="card-glass sabha-main-card">
                
                <!-- Quick Dhikr Selector Pills -->
                <div class="sabha-dhikr-selector" id="sabha-dhikr-list"></div>

                <!-- Active Dhikr Title Banner -->
                <div class="active-dhikr-banner">
                    <span class="dhikr-sublabel">الذكر الحالي:</span>
                    <h2 class="active-dhikr-text" id="sabha-active-dhikr-name">سُبْحَانَ اللَّهِ</h2>
                </div>

                <!-- Target Goal Selector Pills -->
                <div class="sabha-target-pills">
                    <span style="font-size: 0.85rem; color: var(--text-muted); align-self: center;">الهدف:</span>
                    <button class="target-pill-btn active" data-target="33" onclick="setSabhaTarget(33)">٣٣</button>
                    <button class="target-pill-btn" data-target="99" onclick="setSabhaTarget(99)">٩٩</button>
                    <button class="target-pill-btn" data-target="100" onclick="setSabhaTarget(100)">١٠٠</button>
                    <button class="target-pill-btn" data-target="0" onclick="setSabhaTarget(0)">حر ∞</button>
                </div>

                <!-- Milestone Celebration Toast -->
                <div class="milestone-badge" id="sabha-milestone-toast">
                    <svg class="koboyo-icon icon-sm" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    <span id="milestone-toast-text">ما شاء الله! أتممت الدورة بنجاح </span>
                </div>

                <!-- Modern Circular Interactive Masbaha Widget -->
                <div class="luxury-masbaha-dial" id="masbaha-interactive-dial" onclick="handleMasbahaTap(event)" title="انقر للتسبيح">
                    <!-- Circular SVG Progress Ring -->
                    <svg class="masbaha-progress-ring" viewBox="0 0 280 280">
                        <circle class="ring-bg" cx="140" cy="140" r="120"></circle>
                        <circle class="ring-fill" id="masbaha-ring-fill" cx="140" cy="140" r="120"></circle>
                    </svg>

                    <!-- Inner Tactile Tap Disk -->
                    <div class="masbaha-tap-surface" id="masbaha-tap-surface">
                        <div class="masbaha-laps-badge">
                            <span>الدورة </span>
                            <strong id="masbaha-laps-count">1</strong>
                        </div>

                        <!-- Big Digital Number Display -->
                        <div class="masbaha-number-huge" id="masbaha-digit-display">0</div>

                        <div class="masbaha-tap-hint">
                            <svg class="koboyo-icon icon-sm" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="9"></circle>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <span>انقر للتسبيح</span>
                        </div>
                    </div>
                </div>

                <!-- Masbaha Quick Actions Bar -->
                <div class="masbaha-actions-bar">
                    <button class="masbaha-action-btn" id="masbaha-reset-btn" onclick="resetSabha()" title="تصفير العداد">
                        <svg class="koboyo-icon icon-sm" viewBox="0 0 24 24">
                            <polyline points="1 4 1 10 7 10"></polyline>
                            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                        </svg>
                        <span>تصفير</span>
                    </button>

                    <button class="masbaha-action-btn" id="masbaha-color-btn" onclick="cycleSabhaColor()" title="تغيير لون السبحة">
                        <span class="color-indicator-dot" id="sabha-color-dot"></span>
                        <span id="sabha-color-name">كحلي ملكي</span>
                    </button>

                    <button class="masbaha-action-btn" id="masbaha-sound-btn" onclick="toggleSabhaSound()" title="صوت النقر">
                        <span id="sabha-sound-icon">
                            <svg class="koboyo-icon icon-sm" viewBox="0 0 24 24">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                            </svg>
                        </span>
                        <span id="sabha-sound-label">صوت</span>
                    </button>
                </div>

                <!-- Stats Overview Grid -->
                <div class="masbaha-stats-grid">
                    <div class="stat-mini-card">
                        <span class="stat-label">مجموع التسابيح</span>
                        <span class="stat-num" id="masbaha-total-stat">0</span>
                    </div>
                    <div class="stat-mini-card">
                        <span class="stat-label">الدورات المكتملة</span>
                        <span class="stat-num" id="masbaha-laps-stat">0</span>
                    </div>
                    <div class="stat-mini-card">
                        <span class="stat-label">الهدف</span>
                        <span class="stat-num" id="masbaha-target-stat">33</span>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <!-- ==============================================
         Bottom Navigation Bar (5 Tabs with Koboyo Icons)
         ============================================== -->
    <nav class="bottom-nav-container">
        <!-- 1. Adhkar -->
        <a href="adhkar.html" class="nav-tab-btn" title="الأذكار">
            <svg class="koboyo-icon" viewBox="0 0 24 24">
                <path d="M12 10a6 6 0 0 0 -6 -6h-3v2a6 6 0 0 0 6 6h3"></path>
                <path d="M12 14a6 6 0 0 1 6 -6h3v1a6 6 0 0 1 -6 6h-3"></path>
                <path d="M12 20v-10"></path>
            </svg>
            <span>الأذكار</span>
        </a>

        <!-- 2. Prayer Times -->
        <a href="index.html" class="nav-tab-btn" title="المواقيت">
            <svg class="koboyo-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <polyline points="12 7 12 12 15 15"></polyline>
            </svg>
            <span>المواقيت</span>
        </a>

        <!-- 3. Quran -->
        <a href="quran.html" class="nav-tab-btn" title="القرآن">
            <svg class="koboyo-icon" viewBox="0 0 24 24">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
            <span>القرآن</span>
        </a>

        <!-- 4. Qibla -->
        <a href="qibla.html" class="nav-tab-btn" title="القبلة">
            <svg class="koboyo-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>
            <span>القبلة</span>
        </a>

        <!-- 5. Sabha (Active on this page) -->
        <a href="masbaha.html" class="nav-tab-btn active" title="السبحة">
            <svg class="koboyo-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="6" r="2"></circle>
                <circle cx="17" cy="8" r="2"></circle>
                <circle cx="19" cy="13" r="2"></circle>
                <circle cx="17" cy="18" r="2"></circle>
                <circle cx="12" cy="20" r="2"></circle>
                <path d="M12 11c0 3.866-2.239 7-5 7s-5-3.134-5-7 2.239-7 5-7 5 3.134 5 7z"></path>
            </svg>
            <span>السبحة</span>
        </a>
    </nav>

    <!-- App Logic Engine -->
    <script src="app.js?v=4"></script>
</body>
</html>
